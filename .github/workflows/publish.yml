name: Publish to npm

on:
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and test
        run: npm test

      - name: Inspect package
        run: npm pack --dry-run --ignore-scripts

      - name: Read package metadata
        id: package
        shell: bash
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          if node -e "process.exit(require('./package.json').version.includes('-') ? 0 : 1)"; then
            echo "npm_tag=beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release notes
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          node scripts/extract-release-notes.mjs > release-notes.md
          printf '\nPublished package: https://www.npmjs.com/package/%s/v/%s\n' \
            "$PACKAGE_NAME" "$PACKAGE_VERSION" >> release-notes.md

      - name: Check whether version is already published
        id: registry
        shell: bash
        run: |
          if npm view "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.registry.outputs.exists != 'true'
        run: npm publish --provenance --access public --tag "${{ steps.package.outputs.npm_tag }}"

      - name: Create GitHub release with notes
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          PRERELEASE: ${{ steps.package.outputs.prerelease }}
        shell: bash
        run: |
          tag="v${PACKAGE_VERSION}"
          prerelease_args=()
          if [ "$PRERELEASE" = "true" ]; then
            prerelease_args+=(--prerelease)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "Octopus Energy Live ${PACKAGE_VERSION}" \
              --notes-file release-notes.md \
              "${prerelease_args[@]}"
          else
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "Octopus Energy Live ${PACKAGE_VERSION}" \
              --notes-file release-notes.md \
              "${prerelease_args[@]}"
          fi
